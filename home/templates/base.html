{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#789b80" />
    <meta
      name="description"
      content="Savorly is a warm community for discovering, sharing, and saving recipes."
    />
    <title>{% block title %}Savorly — Recipes worth sharing{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'home/images/favicon.svg' %}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'home/css/site.css' %}" />
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% if messages %}
      <div class="message-stack" aria-live="polite">
        {% for message in messages %}
          <div class="site-alert site-alert--{{ message.tags|default:'info' }}">
            <span>{{ message }}</span>
            <button type="button" aria-label="Dismiss message" data-dismiss-message>
              &times;
            </button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block start %}{% endblock %}

    <script src="{% static 'home/js/site.js' %}"></script>
  </body>
</html>
